name: C++ tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: test
          - os: ubuntu-24.04
            target: test-release
          # sanitizers need glibc: no libasan/libubsan on musl, and
          # LeakSanitizer is unsupported on macOS arm64
          - os: ubuntu-24.04
            target: test-sanitize
          - os: macos-15
            target: test
          - os: macos-15
            target: test-release
    runs-on: ${{ matrix.os }}
    env:
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v7

      # libhdf5-dev installs hdf5-serial.pc, with headers under
      # /usr/include/hdf5/serial; the Makefile probes for that name.
      - name: Install libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config

      - name: Install libraries (macOS)
        if: runner.os == 'macOS'
        run: brew install hdf5 pkgconf

      - name: make ${{ matrix.target }}
        run: make ${{ matrix.target }}

      # a missing include is invisible to the suite, since arf.hpp pulls
      # everything in an order that happens to work
      - name: make check-headers
        run: make check-headers

  lint:
    name: strict warnings
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libhdf5-dev pkg-config
      - name: make lint-strict
        run: make lint-strict
